<body data-page="qr">

<main class="container" style="max-width:1000px">
  <section class="card">
    <h2 data-i18n="input_title">Input</h2>
    <div class="card-body">
      <div class="flex-row">
        <div class="flex-1">

            <label for="palletIdInput" data-i18n="lbl_pallet">1. Pallet ID</label>
            <input type="text" id="palletIdInput" value="PAL2026709YZBV007" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="fileInput" data-i18n="lbl_file">2. Upload</label>
            <input type="file" id="fileInput" accept="image/*,.pdf,.xlsx,.xls,.csv">
            <div class="status" id="status" aria-live="polite" data-i18n="st_ready">Ready.</div>
          </div>
        </div>
        <div class="flex-1">

  </section>

  <section class="card">

<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  }

  const $ = (id) => document.getElementById(id);
  const statusDiv = $('status');
  const resultText = $('resultText');
  const palletIdInput = $('palletIdInput');
  const status = (key, vars) => WSK.setText(statusDiv, key, vars);

  $('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    status('st_reading');
    const name = file.name.toLowerCase();
    try {
      if (/\.(xlsx|xls|csv)$/.test(name)) await processExcel(file);
      else if (name.endsWith('.pdf')) await processPDF(file);
      else if (file.type.startsWith('image/')) await processImage(file);
      else status('st_type');
    } catch (err) {
      console.error(err);
      status('st_error');
    }
  });

  function setCodes(codes, okKey) {
    resultText.value = codes.join(', ');
    status(codes.length ? okKey : 'st_none', { n: codes.length });
    renderPreview();
  }

  async function processExcel(file) {
    if (typeof XLSX === 'undefined') { status('xlsx_missing'); return; }
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
    const tokens = [];
    rows.forEach(row => row.forEach(cell => {
      if (cell !== null && cell !== undefined) { const s = String(cell).trim(); if (s) tokens.push(s); }
    }));
    setCodes(filterCodes(tokens), 'st_excel_ok');
  }

  async function processPDF(file) {
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const content = await (await pdf.getPage(i)).getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    setCodes(filterCodes(text.split(/[\s,]+/)), 'st_pdf_ok');
  }

  async function processImage(file) {
    status('st_scanning');
    const worker = await Tesseract.createWorker('eng');
    const ret = await worker.recognize(file);
    await worker.terminate();
    setCodes(filterCodes(ret.data.text.split(/[\s,]+/)), 'st_img_ok');
  }

  // Keeps codes with dashes etc.; drops short item numbers and header words.
  function filterCodes(tokens) {
    const skip = new Set(['S/N', 'LIST', 'ITEM', 'ZONNEPLAN', 'NEXUS', 'THUISBATTERIJ']);
    const valid = [];
    tokens.forEach(token => {
      const clean = String(token).replace(/^\.+|\.+$/g, '').trim();
      if (/^\d{1,3}$/.test(clean)) return;
      if (skip.has(clean.toUpperCase())) return;
      if (clean.length >= 5 && /[A-Z0-9]/i.test(clean)) valid.push(clean);
    });
    return [...new Set(valid)];
  }

  function renderPreview() {
    const raw = resultText.value.trim();
    const palletId = palletIdInput.value.trim() || 'PALLET-N/A';
    const container = $('pdfExportContainer');
    container.innerHTML = '';
    container.setAttribute('data-empty', WSK.t('preview_empty'));
    if (!raw) return;

    const items = raw.split(',').map(s => s.trim()).filter(Boolean);
    const PER_PAGE = 32;
    const totalPages = Math.ceil(items.length / PER_PAGE) || 1;

    for (let p = 0; p < totalPages; p++) {
      const pageItems = items.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
      const pageValue = pageItems.join(', ');

      const page = document.createElement('div');
      page.className = 'a4Page';
      page.innerHTML = `
        <div class="a4-header">
          <div class="pallet-info">
            <span class="pallet-text">${WSK.esc(WSK.t('a4_pallet'))}: [ ${WSK.esc(palletId)} ]</span>
            <div class="pallet-barcode-container"><svg id="pallet-bc-${p}"></svg></div>
          </div>
          <div class="page-number-tag">${WSK.esc(WSK.t('a4_page', { n: p + 1, total: totalPages }))}</div>
        </div>
        <div class="a4-content">
          <div class="left-col">
            ${pageItems.map((code, i) => `<div class="barcode-item"><svg id="item-bc-${p}-${i}"></svg><div class="barcode-val">${WSK.esc(code)}</div></div>`).join('')}
          </div>
          <div class="right-col">
            <div class="qr-box">
              <h3>${WSK.esc(WSK.t('a4_qr'))}</h3>
              <div class="qr-container" id="qr-target-${p}"></div>
              <div class="qr-desc">${WSK.esc(pageValue)}</div>
            </div>
          </div>
        </div>`;
      container.appendChild(page);

      const bc = (sel, val, h) => {
        try { JsBarcode(sel, val, { format: 'CODE128', displayValue: false, height: h, margin: 0 }); }
        catch (e) { JsBarcode(sel, 'ERR', { displayValue: false }); }
      };
      if (window.JsBarcode) {
        bc(`#pallet-bc-${p}`, palletId, 35);
        pageItems.forEach((code, i) => bc(`#item-bc-${p}-${i}`, code, 22));
      }
      if (window.QRCode) {
        new QRCode($(`qr-target-${p}`), { text: pageValue, width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M });
      }
    }
  }

  function downloadPDF() {
    if (!resultText.value.trim()) { renderPreview(); return; }
    status('st_pdf_making');
    const name = (palletIdInput.value.trim() || 'export').replace(/[^\w.-]+/g, '_');
    html2pdf().set({
      margin: 0,
      filename: `${WSK.t('pdf_file')}_${name}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    }).from($('pdfExportContainer')).save().then(() => status('st_pdf_done'));
  }

  let previewTimer;
  resultText.addEventListener('input', () => { clearTimeout(previewTimer); previewTimer = setTimeout(renderPreview, 400); });
  palletIdInput.addEventListener('input', () => { clearTimeout(previewTimer); previewTimer = setTimeout(renderPreview, 400); });
  document.addEventListener('wsk:langchange', renderPreview);

  window.addEventListener('load', () => {
    resultText.value = 'Y260523D30530469, Y260523D30530467, Y260523D30530468, Y260523D30530471, Y260523D30530473, Y260523D30530474, Y260523D30530472, Y260523D30530476, Y260523D30530477, Y260523D30530478, Y260523D30530480, Y260523D30530479, Y260523D30530475, Y260523D30530481, Y260523D30530455, Y260523D30530270, Y260523D30530271, Y260523D30530272, Y260523D30530269, Y260523D30530274, Y260523D30530277, Y260523D30530273, Y260523D30530267, Y260523D30530280, Y260523D30530278, Y260523D30530281, Y260523D30530279, Y260523D30530284, Y260523D30530282, Y260523D30530285, Y260523D30530283, Y260523D30530288';
    renderPreview();
  });
</script>
