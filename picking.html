    lbl_sort_by: 'Sortiraj po', opt_sort_qty: 'Količini (od najveće)', opt_sort_name: 'Nazivu / liniji (A–Ž)',

    opt_order: '{o} · {n} linija', info_order: '{p} · {c} · {d} · {n} linija · {q} kom', urgent: 'Hitno', normal: 'Normalno',
    line_n: 'Linija {n}', col_loc: 'Picking lokacija', col_desc: 'Opis', not_floor: 'nema na podu', upper: 'viši nivo', no_stock: 'nema na zalihi',

</head>
<body data-page="picking">
<header class="app-header">
  <div class="app-header-inner">
    <a class="brand" href="index.html"><span class="brand-mark">W+</span><span class="brand-text"><strong>Warehouse Swiss Knife</strong><span data-i18n="brand_sub">Warehouse operations toolkit</span></span></a>
    <div class="lang-switcher" data-lang-switcher></div>
  </div>
</header>

<section class="page-hero">
  <div class="kicker">&gt; wsk://operations/picking</div>
  <h1 data-i18n="page_title">Picking consolidation</h1>
  <p data-i18n="page_sub"></p>
</section>

<main class="container">
  <section class="card" id="selCard" hidden>
    <h2 data-i18n="sel_title">Order</h2>
    <div class="card-body">
      <div class="flex-row">
        <div class="form-group flex-1">
          <label for="selClient" data-i18n="lbl_client">Client</label>
          <select id="selClient"></select>
        </div>
        <div class="form-group flex-1">
          <label for="selOrder" data-i18n="lbl_order">Order number</label>
          <select id="selOrder" disabled></select>
        </div>
      </div>
      <div class="status" id="orderInfo" aria-live="polite"></div>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="excel_title">Import from Excel</h2>
    <div class="card-body">
      <p class="hint" data-i18n="excel_desc"></p>
      <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
      <div class="status" id="excelStatus" aria-live="polite"></div>
      <div class="src-line" id="srcLine"></div>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="manual_title">Manual entry</h2>
    <div class="card-body">
      <div class="form-group">
        <label for="prodName" data-i18n="lbl_prod_name">Product</label>
        <input type="text" id="prodName" data-i18n-placeholder="ph_prod_name">
      </div>
      <div class="flex-row">
        <div class="form-group flex-1">
          <label for="prodTotal" data-i18n="lbl_total_qty">Quantity</label>
          <input type="number" id="prodTotal" min="1" inputmode="numeric" data-i18n-placeholder="ph_total_qty">
        </div>
        <div class="form-group flex-1">
          <label for="prodLine" data-i18n="lbl_line">Line / location</label>
          <input type="text" id="prodLine" data-i18n-placeholder="ph_line">
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" onclick="addManualEntry()" data-i18n="btn_add">Add entry</button>
        <button type="button" class="btn btn-primary" onclick="processAndShowResults()" data-i18n="btn_show">Show results</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2><span data-i18n="prepared_lines">Prepared lines</span> <span>(<span id="entryCount">0</span>)</span></h2>
    <div class="table-wrap">
      <table id="bufferTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="col_prod">Product</th>
            <th data-i18n="col_total">Quantity</th>
            <th data-i18n="col_line">Line</th>
            <th data-i18n="col_loc">Pick location</th>
            <th data-i18n="col_action">Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<div id="resultModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <h2 id="modalTitle" data-i18n="modal_title">Consolidated picking results</h2>
    <div class="modal-body">
      <div class="flex-row">
        <div class="form-group flex-1">
          <label for="groupBy" data-i18n="lbl_group_by">Group by</label>
          <select id="groupBy" onchange="recalculateResults()">
            <option value="line" data-i18n="opt_by_line">Line</option>
            <option value="product" data-i18n="opt_by_product">Product</option>
            <option value="both" data-i18n="opt_by_both">Product and line</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label for="sortBy" data-i18n="lbl_sort_by">Sort by</label>
          <select id="sortBy" onchange="renderResults()">
            <option value="total" data-i18n="opt_sort_qty">Quantity</option>
            <option value="name" data-i18n="opt_sort_name">Name / line</option>
          </select>
        </div>
      </div>
    </div>
    <div class="table-wrap">
      <table id="resultsTable">
        <thead id="resultsHead"></thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
    <div class="modal-body">
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" onclick="closeModal()" data-i18n="btn_close">Close</button>
        <button type="button" class="btn btn-danger" onclick="clearAllData()" data-i18n="btn_clear">Clear data</button>
      </div>
    </div>
  </div>
</div>

<nav class="nav-bar" data-nav></nav>

<script>
  let rawEntries = [], aggregatedResults = [];
  const $ = (id) => document.getElementById(id);

  /* rows: A = product, B = quantity, C = line (row 1 = header) */
  function loadRows(data) {
    const rows = data.rows || [];
    rawEntries = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || r.length < 3) continue;
      const product = String(r[0] ?? '').trim();
      const line = String(r[2] ?? '').trim();
      if (product && line) rawEntries.push({ product, total: parseInt(r[1], 10) || 0, line });
    }
    WSK.setText($('excelStatus'), 'excel_loaded', { n: rawEntries.length });
    updateBufferTable();
  }

  // own Excel file: lines as before. Master workbook: choose client → order (below).
  const source = WSKSession.wireModule({
    page: 'picking', srcEl: $('srcLine'), load: loadRows,
    clear: () => { rawEntries = []; updateBufferTable(); },
    fromMain: () => null
  });

  /* ---------- client → order (master workbook) ----------
     Orders: A order, B line, C client, D date, E priority, F product, G quantity, H carrier */
  const str = (v) => v == null ? '' : String(v).trim();
  let ORD = [], CLIENTS = new Map(), DESC = new Map(), PICK = new Map();

  function buildPickLocations() {
    // floor locations first (level 0), most stock first; otherwise the upper level with most stock
    PICK = new Map();
    WSKSession.sheet('stock').forEach(r => {
      const loc = WSKWarehouse ? WSKWarehouse.parseLoc(r[0]) : null, code = str(r[1]);
      if (!loc || !code) return;
      const q = parseFloat(r[3]) || 0;
      if (!PICK.has(code)) PICK.set(code, []);
      PICK.get(code).push({ code: loc.code, lvl: loc.lvl, qty: q });
    });
    PICK.forEach(list => list.sort((a, b) => (a.lvl === 0 ? 0 : 1) - (b.lvl === 0 ? 0 : 1) || b.qty - a.qty));
  }

  function initOrders() {
    ORD = WSKSession.sheet('orders').filter(r => str(r[0]) && str(r[5]));
    if (!ORD.length) { $('selCard').hidden = true; return; }
    CLIENTS = new Map(WSKSession.sheet('clients').map(r => [str(r[0]), str(r[1])]));
    DESC = new Map(WSKSession.sheet('masterdata').map(r => [str(r[0]), str(r[1])]));
    buildPickLocations();
    $('selCard').hidden = false;
    fillClients();
  }

  function fillClients() {
    const keep = $('selClient').value;
    const ids = [...new Set(ORD.map(r => str(r[2])))].sort();
    $('selClient').innerHTML = `<option value="">${WSK.esc(WSK.t('opt_choose_client'))}</option>` +
      ids.map(id => `<option value="${WSK.esc(id)}">${WSK.esc(id)} · ${WSK.esc(CLIENTS.get(id) || '')}</option>`).join('');
    $('selClient').value = ids.includes(keep) ? keep : '';
    fillOrders();
  }

  function fillOrders() {
    const cid = $('selClient').value, keep = $('selOrder').value;
    const sel = $('selOrder');
    if (!cid) { sel.innerHTML = `<option value="">${WSK.esc(WSK.t('opt_choose_order'))}</option>`; sel.disabled = true; showOrderInfo(); return; }
    const counts = new Map();
    ORD.filter(r => str(r[2]) === cid).forEach(r => counts.set(str(r[0]), (counts.get(str(r[0])) || 0) + 1));
    const nos = [...counts.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    sel.innerHTML = `<option value="">${WSK.esc(WSK.t('opt_choose_order'))}</option>` +
      nos.map(o => `<option value="${WSK.esc(o)}">${WSK.esc(WSK.t('opt_order', { o, n: counts.get(o) }))}</option>`).join('');
    sel.disabled = false;
    sel.value = nos.includes(keep) ? keep : '';
    showOrderInfo();
  }

  function orderLines(no) {
    return ORD.filter(r => str(r[0]) === no).sort((a, b) => (parseInt(a[1], 10) || 0) - (parseInt(b[1], 10) || 0));
  }

  function showOrderInfo() {
    const no = $('selOrder').value;
    if (!no) { WSK.setText($('orderInfo'), null); return; }
    const lines = orderLines(no), f = lines[0];
    const urgent = /^(urgent|hitno|spoed)/i.test(str(f[4]));
    const pcs = lines.reduce((s, r) => s + (parseFloat(r[6]) || 0), 0);
    $('orderInfo').removeAttribute('data-i18n');
    $('orderInfo').textContent = WSK.t('info_order', { p: WSK.t(urgent ? 'urgent' : 'normal'), c: str(f[7]) || '—', d: str(f[3]), n: lines.length, q: pcs.toLocaleString() });
    $('orderInfo').style.color = urgent ? 'var(--warn)' : '';
  }

  function loadOrder() {
    const no = $('selOrder').value;
    showOrderInfo();
    if (!no) return;
    rawEntries = orderLines(no).map((r, i) => {
      const n = parseInt(r[1], 10) || i + 1;
      return { product: str(r[5]), total: parseInt(r[6], 10) || 0, line: String(n), lineNo: n, desc: DESC.get(str(r[5])) || '' };
    });
    WSK.setText($('excelStatus'), 'order_loaded', { o: no, n: rawEntries.length });
    updateBufferTable();
  }

  $('selClient').addEventListener('change', () => { $('selOrder').value = ''; fillOrders(); });
  $('selOrder').addEventListener('change', loadOrder);
  WSKSession.ready.then(initOrders);

  const lineLabel = (item) => item.lineNo ? WSK.t('line_n', { n: item.lineNo }) : item.line;

  function pickCell(item) {
    const list = PICK.get(item.product);
    if (!list || !list.length) return `<span class="muted">${item.lineNo ? WSK.esc(WSK.t('no_stock')) : ''}</span>`;
    const best = list[0];
    const note = best.lvl === 0 ? `<span class="muted"> · ${best.qty}</span>` : `<span class="muted"> · ${WSK.esc(WSK.t('upper'))}</span>`;
    return `<span class="loc-tag">${WSK.esc(best.code)}</span>${note}`;
  }

  $('excelFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    WSK.readWorkbook(file, (wb) => {
      const data = { rows: WSK.sheetRows(wb, 0) };
      loadRows(data);
      source.saved(file.name, data);
    }, $('excelStatus'));
  });

  function addManualEntry() {
    const product = $('prodName').value.trim();
    const total = parseInt($('prodTotal').value, 10);
    const line = $('prodLine').value.trim();
    if (!product || isNaN(total) || !line) { alert(WSK.t('msg_fill')); return; }
    rawEntries.push({ product, total, line });
    $('prodName').value = ''; $('prodTotal').value = ''; $('prodLine').value = '';
    $('prodName').focus();
    updateBufferTable();
  }

  function removeEntry(idx) { rawEntries.splice(idx, 1); updateBufferTable(); }

  function updateBufferTable() {
    const tbody = document.querySelector('#bufferTable tbody');
    $('entryCount').textContent = rawEntries.length;
    if (!rawEntries.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-cell">${WSK.esc(WSK.t('no_rows'))}</td></tr>`;
      return;
    }
    tbody.innerHTML = rawEntries.map((item, i) => `
      <tr>
        <td class="num">${i + 1}</td>
        <td><strong>${WSK.esc(item.product)}</strong>${item.desc ? `<div class="muted" style="font-size:12px">${WSK.esc(item.desc)}</div>` : ''}</td>
        <td class="num">${item.total}</td>
        <td><span class="loc-tag">${WSK.esc(lineLabel(item))}</span></td>
        <td>${pickCell(item)}</td>
        <td><button type="button" class="btn btn-danger btn-sm" onclick="removeEntry(${i})" aria-label="${WSK.esc(WSK.t('remove'))}">×</button></td>
      </tr>`).join('');
  }

  function processAndShowResults() {
    if (!rawEntries.length) { alert(WSK.t('msg_no_items')); return; }
    recalculateResults();
    $('resultModal').classList.add('open');
  }
  function closeModal() { $('resultModal').classList.remove('open'); }
  function clearAllData() {
    rawEntries = []; aggregatedResults = [];
    updateBufferTable(); closeModal();
    WSK.resetFile($('excelFile')); WSK.setText($('excelStatus'), null);
  }

  function recalculateResults() {
    const mode = $('groupBy').value;
    const map = new Map();
    rawEntries.forEach(item => {
      const key = mode === 'line' ? item.line.toUpperCase()
        : mode === 'product' ? item.product.toUpperCase()
        : item.product.toUpperCase() + '__' + item.line.toUpperCase();
      if (!map.has(key)) map.set(key, { label: mode === 'line' ? item.line : item.product, product: item.product, line: item.line, lineNo: item.lineNo, total: 0 });
      map.get(key).total += item.total;
    });
    aggregatedResults = Array.from(map.values());
    renderResults();
  }

  function renderResults() {
    const sortBy = $('sortBy').value;
    const mode = $('groupBy').value;
    aggregatedResults.sort((a, b) => sortBy === 'total'
      ? b.total - a.total
      : (mode === 'line' && a.lineNo && b.lineNo) ? a.lineNo - b.lineNo
      : (a.label + a.line).localeCompare(b.label + b.line, undefined, { numeric: true }));

    $('resultsHead').innerHTML = mode === 'both'
      ? `<tr><th>${WSK.esc(WSK.t('col_prod'))}</th><th>${WSK.esc(WSK.t('col_line'))}</th><th>${WSK.esc(WSK.t('col_total'))}</th></tr>`
      : `<tr><th>${WSK.esc(WSK.t(mode === 'line' ? 'col_line' : 'col_prod'))}</th><th>${WSK.esc(WSK.t('col_total'))}</th></tr>`;

    $('resultsBody').innerHTML = aggregatedResults.map(item => mode === 'both'
      ? `<tr><td><strong>${WSK.esc(item.product)}</strong></td><td><span class="loc-tag">${WSK.esc(lineLabel(item))}</span></td><td class="num val-good">${item.total}</td></tr>`
      : `<tr><td>${mode === 'line' ? `<span class="loc-tag">${WSK.esc(lineLabel(item))}</span>` : `<strong>${WSK.esc(item.label)}</strong>`}</td><td class="num val-good">${item.total}</td></tr>`
    ).join('');
  }

  $('resultModal').addEventListener('click', (e) => { if (e.target.id === 'resultModal') closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  document.addEventListener('wsk:langchange', () => {
    if (ORD.length) { fillClients(); }
    updateBufferTable();
    if ($('resultModal').classList.contains('open')) renderResults();
  });
  updateBufferTable();
</script>
