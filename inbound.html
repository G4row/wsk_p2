<style>
  .po-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
  .kv span { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .kv b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--white); }
  .kv b.good { color: var(--accent); }
  .kv b.warn { color: var(--warn); }
  tr.unknown td { background: rgba(255, 210, 63, .06); }
  .warn-tag { display: inline-block; margin-top: 4px; padding: 1px 6px; border: 1px dashed var(--warn); color: var(--warn); font-size: 11px; }
  .pt { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
</style>

</head>
<body data-page="inbound">
<header class="app-header">
  <div class="app-header-inner">
    <a class="brand" href="index.html"><span class="brand-mark">W+</span><span class="brand-text"><strong>Warehouse Swiss Knife</strong><span data-i18n="brand_sub">Warehouse operations toolkit</span></span></a>
    <div class="lang-switcher" data-lang-switcher></div>
  </div>
</header>

<section class="page-hero">
  <div class="kicker">&gt; wsk://operations/inbound</div>
  <h1 data-i18n="page_title">Inbound</h1>
  <p data-i18n="page_sub"></p>
</section>

<main class="container">
  <section class="card">
    <h2 data-i18n="sel_title">Purchase order</h2>
    <div class="card-body">
      <div class="flex-row">
        <div class="form-group flex-1">
          <label for="selClient" data-i18n="lbl_client">Client</label>
          <select id="selClient"></select>
        </div>
        <div class="form-group flex-1">
          <label for="selPo" data-i18n="lbl_po">Purchase order</label>
          <select id="selPo" disabled></select>
        </div>
      </div>
      <div class="status" id="selInfo" aria-live="polite"></div>
    </div>
  </section>

  <section class="card" id="poCard" hidden>
    <h2><span data-i18n="lines_title">Products arriving</span> <span id="poTitle" style="color: var(--white)"></span></h2>
    <div class="card-body">
      <div class="po-head" id="poHead"></div>
    </div>
    <div class="table-wrap">
      <table id="poTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="col_prod">Product</th>
            <th data-i18n="col_qty">Qty (pcs)</th>
            <th data-i18n="col_per">Pcs/pallet</th>
            <th data-i18n="col_full">Full pallets</th>
            <th data-i18n="col_boxes">Boxes</th>
            <th data-i18n="col_rest">Pcs</th>
            <th data-i18n="col_type">Pallet</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="excel_title">Import from Excel</h2>
    <div class="card-body">
      <p class="hint" data-i18n="excel_desc"></p>
      <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
      <div class="status" id="excelStatus" aria-live="polite"></div>
      <div class="src-line" id="srcLine"></div>
    </div>
  </section>
</main>

<nav class="nav-bar" data-nav></nav>

<script>
  const $ = (id) => document.getElementById(id);
  const str = (v) => v == null ? '' : String(v).trim();
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  const fmtN = (n) => Number(n).toLocaleString({ en: 'en-GB', nl: 'nl-NL', hr: 'hr-HR' }[WSK.getLang()] || undefined);

  /* Inbound rows: A PO, B client, C date, D ETA, E dock, F product, G qty, H note */
  let ROWS = [];

  function masterMaps() {
    const md = new Map();
    WSKSession.sheet('masterdata').forEach(r => {
      const code = str(r[0]); if (!code) return;
      const kpk = num(r[3]) || 1, kpp = num(r[4]);
      md.set(code, { desc: str(r[1]), kpk, kpp, full: num(r[5]) || kpk * kpp, type: str(r[9]) });
    });
    const clients = new Map(WSKSession.sheet('clients').map(r => [str(r[0]), str(r[1])]));
    return { md, clients };
  }
  let M = { md: new Map(), clients: new Map() };

  function loadRows(data) {
    ROWS = (data.rows || []).slice(1).filter(r => r && str(r[0]) && str(r[5]));
    M = masterMaps();
    fillClients();
  }

  const source = WSKSession.wireModule({
    page: 'inbound', srcEl: $('srcLine'), load: loadRows,
    clear: () => { ROWS = []; fillClients(); },
    fromMain: () => {
      const r = WSKSession.sheet('inbound');
      return r.length ? { rows: [['po'], ...r] } : null;
    }
  });
  WSKSession.ready.then(() => { if (!ROWS.length) fillClients(); });

  $('excelFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    WSK.readWorkbook(file, (wb) => {
      const data = { rows: WSK.sheetRows(wb, 0) };
      loadRows(data);
      WSK.setText($('excelStatus'), 'excel_loaded', { n: ROWS.length });
      source.saved(file.name, data);
    }, $('excelStatus'));
  });

  function fillClients() {
    const keep = $('selClient').value;
    const ids = [...new Set(ROWS.map(r => str(r[1])))].sort();
    $('selClient').innerHTML = `<option value="">${WSK.esc(WSK.t('opt_choose_client'))}</option>` +
      ids.map(id => `<option value="${WSK.esc(id)}">${WSK.esc(id)} · ${WSK.esc(M.clients.get(id) || '')}</option>`).join('');
    $('selClient').value = ids.includes(keep) ? keep : (ids.length === 1 ? ids[0] : '');
    $('selClient').disabled = !ids.length;
    WSK.setText($('selInfo'), ids.length ? 'choose' : 'no_data');
    fillPos();
  }

  function fillPos() {
    const cid = $('selClient').value, keep = $('selPo').value, sel = $('selPo');
    if (!cid) { sel.innerHTML = `<option value="">${WSK.esc(WSK.t('opt_choose_po'))}</option>`; sel.disabled = true; render(); return; }
    const pos = new Map();
    ROWS.filter(r => str(r[1]) === cid).forEach(r => {
      const p = pos.get(str(r[0])) || { n: 0, eta: str(r[3]) }; p.n++; pos.set(str(r[0]), p);
    });
    const list = [...pos.entries()].sort((a, b) => a[1].eta.localeCompare(b[1].eta) || a[0].localeCompare(b[0]));
    sel.innerHTML = `<option value="">${WSK.esc(WSK.t('opt_choose_po'))}</option>` +
      list.map(([po, p]) => `<option value="${WSK.esc(po)}">${WSK.esc(WSK.t('opt_po', { po, eta: p.eta || '--:--', n: p.n }))}</option>`).join('');
    sel.disabled = false;
    const nos = list.map(x => x[0]);
    sel.value = nos.includes(keep) ? keep : (nos.length === 1 ? nos[0] : '');
    render();
  }

  function render() {
    const po = $('selPo').value;
    if (!po) { $('poCard').hidden = true; if (ROWS.length) WSK.setText($('selInfo'), 'choose'); return; }
    $('selInfo').textContent = '';
    const lines = ROWS.filter(r => str(r[0]) === po);
    const f = lines[0];
    let pcs = 0, pallets = 0, unknown = 0;
    const body = lines.map((r, i) => {
      const code = str(r[5]), q = num(r[6]), m = M.md.get(code);
      pcs += q;
      if (!m || !m.full) {
        unknown++;
        return `<tr class="unknown"><td class="num">${i + 1}</td><td><strong>${WSK.esc(code)}</strong><div><span class="warn-tag">${WSK.esc(WSK.t('unknown'))}</span></div></td>
          <td class="num">${fmtN(q)}</td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td></tr>`;
      }
      const full = Math.floor(q / m.full), restPcs = q - full * m.full;
      const boxes = Math.floor(restPcs / m.kpk), rest = restPcs - boxes * m.kpk;
      pallets += full + (restPcs > 0 ? 1 : 0);
      return `<tr><td class="num">${i + 1}</td>
        <td><strong>${WSK.esc(code)}</strong><div class="muted" style="font-size:12px">${WSK.esc(m.desc)}</div></td>
        <td class="num">${fmtN(q)}</td><td class="num">${fmtN(m.full)}</td>
        <td class="num ${full ? 'val-good' : 'muted'}">${full}</td><td class="num">${boxes}</td><td class="num ${rest ? 'val-bad' : ''}">${rest}</td>
        <td><span class="pt">${WSK.esc(m.type || '')}</span></td></tr>`;
    }).join('');
    $('poTable').querySelector('tbody').innerHTML = body;
    $('poTitle').textContent = '· ' + po;
    const kv = (k, v, cls) => `<div class="kv"><span>${WSK.esc(WSK.t(k))}</span><b class="${cls || ''}">${WSK.esc(String(v))}</b></div>`;
    $('poHead').innerHTML = kv('k_eta', str(f[3]) || '--:--') + kv('k_dock', str(f[4]) || '—') + kv('k_lines', lines.length) +
      kv('k_pcs', fmtN(pcs)) + kv('k_pal', pallets, 'good') + (unknown ? kv('k_new', unknown, 'warn') : '');
    $('poCard').hidden = false;
  }

  $('selClient').addEventListener('change', () => { $('selPo').value = ''; fillPos(); });
  $('selPo').addEventListener('change', render);
  document.addEventListener('wsk:langchange', fillClients);
</script>
</body>
</html>
