<body data-page="locations">

</section>

<main class="container">
  <section class="card">

        <div class="form-group">
          <label for="inputNN" data-i18n="lbl_nn">2. NN</label>
          <input type="text" id="inputNN" data-i18n-placeholder="ph_nn" value="01-05" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="inputL" data-i18n="lbl_l">3. L</label>
          <input type="text" id="inputL" data-i18n-placeholder="ph_l" value="A-C" autocapitalize="characters" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="inputN" data-i18n="lbl_n">4. N</label>
          <input type="text" id="inputN" data-i18n-placeholder="ph_n" value="1-3" autocomplete="off">
        </div>
      </div>
      <p class="status" id="previewCount" aria-live="polite"></p>
      <div class="btn-group" style="margin-top:12px">
        <button type="button" class="btn btn-primary" onclick="generateLocations()" data-i18n="btn_generate">Generate locations</button>
        <button type="button" class="btn btn-secondary" onclick="clearInputs()" data-i18n="btn_clear_input">Clear inputs</button>
      </div>
    </div>
  </section>

  <section class="card" id="resultsCard" hidden>
    <h2><span data-i18n="gen_results">Generated locations</span> <span>(<span id="locCount">0</span>)</span></h2>
    <div class="card-body">
      <div class="btn-group">
        <button type="button" class="btn btn-primary" onclick="exportToExcel()" data-i18n="btn_export_excel">Download Excel</button>
        <button type="button" class="btn btn-secondary" onclick="copyToClipboard()" data-i18n="btn_copy">Copy list</button>
      </div>
      <div class="status" id="copyStatus" aria-live="polite"></div>
    </div>
    <div class="table-wrap">
      <table id="locTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="col_loc_code">Location code</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<nav class="nav-bar" data-nav></nav>

<script>
  let generatedList = [];
  const MAX_LOCATIONS = 50000;
  const $ = (id) => document.getElementById(id);
  const FIELDS = [['inputLL', false], ['inputNN', true], ['inputL', false], ['inputN', true]];

  // Parses "A", "A,B,C", "A-S", "[A-D]", "AA-AC", "01-42"
  function parseRangeInput(inputStr, isNumeric) {
    const str = String(inputStr || '').toUpperCase().replace(/[\[\]\s]/g, '');
    if (!str) return [];
    const result = [];

    str.split(',').filter(Boolean).forEach(part => {
      const dash = part.indexOf('-', 1);
      if (dash === -1) { result.push(part); return; }
      const start = part.slice(0, dash);
      const end = part.slice(dash + 1);

      if (isNumeric || (/^\d+$/.test(start) && /^\d+$/.test(end))) {
        const a = parseInt(start, 10), b = parseInt(end, 10);
        if (isNaN(a) || isNaN(b)) return;
        const pad = Math.max(start.length, end.length);
        for (let i = Math.min(a, b); i <= Math.max(a, b); i++) result.push(String(i).padStart(pad, '0'));
      } else if (/^[A-Z]+$/.test(start) && /^[A-Z]+$/.test(end) && start.length === end.length && start.length <= 2) {
        // Letter ranges: A-S, or AA-AC / AA-BZ (counts through two letters like a spreadsheet)
        const toNum = s => s.split('').reduce((n, ch) => n * 26 + (ch.charCodeAt(0) - 65), 0);
        const toStr = (n, len) => { let s = ''; for (let k = 0; k < len; k++) { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); } return s; };
        const a = toNum(start), b = toNum(end);
        for (let i = Math.min(a, b); i <= Math.max(a, b); i++) result.push(toStr(i, start.length));
      } else {
        result.push(part);
      }
    });
    return [...new Set(result)];
  }

  function lists() { return FIELDS.map(([id, num]) => parseRangeInput($(id).value, num)); }

  function updatePreview() {
    const l = lists();
    const n = l.every(x => x.length) ? l.reduce((p, x) => p * x.length, 1) : 0;
    if (n) WSK.setText($('previewCount'), 'preview', { n: n.toLocaleString() });
    else WSK.setText($('previewCount'), null);
  }

  function generateLocations() {
    const [ll, nn, l, n] = lists();
    if (!ll.length || !nn.length || !l.length || !n.length) { alert(WSK.t('msg_fill')); return; }
    const total = ll.length * nn.length * l.length * n.length;
    if (total > MAX_LOCATIONS) { alert(WSK.t('msg_too_many', { n: total.toLocaleString(), max: MAX_LOCATIONS.toLocaleString() })); return; }

    generatedList = [];
    ll.forEach(a => nn.forEach(b => l.forEach(c => n.forEach(d => generatedList.push(`${a}-${b}-${c}-${d}`)))));
    renderResults();
  }

  function renderResults() {
    $('resultsCard').hidden = false;
    $('locCount').textContent = generatedList.length;
    WSK.setText($('copyStatus'), null);
    document.querySelector('#locTable tbody').innerHTML = generatedList
      .map((code, i) => `<tr><td class="num">${i + 1}</td><td><span class="loc-tag">${WSK.esc(code)}</span></td></tr>`).join('');
  }

  function clearInputs() {
    FIELDS.forEach(([id]) => $(id).value = '');
    $('resultsCard').hidden = true;
    generatedList = [];
    updatePreview();
    $('inputLL').focus();
  }

  function exportToExcel() {
    if (!generatedList.length) return;
    if (typeof XLSX === 'undefined') { alert(WSK.t('xlsx_missing')); return; }
    const header = WSK.t('col_loc_code');
    const ws = XLSX.utils.json_to_sheet(generatedList.map(code => ({ [header]: code })));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, WSK.t('xl_sheet').slice(0, 31));
    XLSX.writeFile(wb, `${WSK.t('xl_file')}.xlsx`);
  }

  function copyToClipboard() {
    if (!generatedList.length) return;
    const text = generatedList.join('\n');
    const ok = () => WSK.setText($('copyStatus'), 'msg_copied');
    const fail = () => WSK.setText($('copyStatus'), 'msg_copy_failed');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, fail);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? ok() : fail(); } catch (e) { fail(); }
      ta.remove();
    }
  }

  FIELDS.forEach(([id]) => $(id).addEventListener('input', updatePreview));
  FIELDS.forEach(([id]) => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') generateLocations(); }));
  updatePreview();
</script>
</body>
