</head>
<body data-page="abc">
<header class="app-header">
  <div class="app-header-inner">
    <a class="brand" href="index.html"><span class="brand-mark">W+</span><span class="brand-text"><strong>Warehouse Swiss Knife</strong><span data-i18n="brand_sub">Warehouse operations toolkit</span></span></a>
    <div class="lang-switcher" data-lang-switcher></div>
  </div>
</header>

<section class="page-hero">
  <div class="kicker">&gt; wsk://inventory/abc</div>
  <h1 data-i18n="page_title">ABC analysis &amp; locations</h1>
  <p data-i18n="page_sub"></p>
</section>

<main class="container">
  <section class="card">
    <h2 data-i18n="excel_title">Import from Excel</h2>
    <div class="card-body">
      <p class="hint" data-i18n="excel_abc_desc"></p>
      <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
      <div class="status" id="excelStatus" aria-live="polite"></div>
      <div class="src-line" id="srcLine"></div>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="manual_prod_title">Manual product entry</h2>
    <div class="card-body">
      <div class="form-group">
        <label for="prodName" data-i18n="lbl_prod_name">Product name</label>
        <input type="text" id="prodName" data-i18n-placeholder="ph_prod_name">
      </div>
      <div class="flex-row">
        <div class="form-group flex-1">
          <label for="prodWeight" data-i18n="lbl_weight">Weight (kg)</label>
          <input type="number" id="prodWeight" step="0.01" min="0" inputmode="decimal" data-i18n-placeholder="ph_weight">
        </div>
        <div class="form-group flex-1">
          <label for="prodSales" data-i18n="lbl_sales">Sales (pcs)</label>
          <input type="number" id="prodSales" min="0" inputmode="numeric" data-i18n-placeholder="ph_sales">
        </div>
        <div class="form-group flex-1">
          <label for="prodPrice" data-i18n="lbl_price">Price (€)</label>
          <input type="number" id="prodPrice" step="0.01" min="0" inputmode="decimal" data-i18n-placeholder="ph_price">
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" onclick="addManualProduct()" data-i18n="btn_add_prod">Add product</button>
        <button type="button" class="btn btn-primary" onclick="calculateABC()" data-i18n="btn_run_abc">Run ABC analysis</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2><span data-i18n="prepared_prods">Products</span> <span>(<span id="productCount">0</span>)</span></h2>
    <div class="card-body">
      <div class="form-group">
        <label for="sortProductsBy" data-i18n="lbl_sort_prods">Sort products by</label>
        <select id="sortProductsBy" onchange="renderProductsTable()">
          <option value="name" data-i18n="opt_sort_name_asc">Product name</option>
          <option value="combined" data-i18n="opt_sort_comb">Combined category</option>
          <option value="weight" data-i18n="opt_sort_weight">ABC weight</option>
          <option value="sales" data-i18n="opt_sort_sales">ABC sales</option>
          <option value="price" data-i18n="opt_sort_price">ABC price</option>
        </select>
      </div>
    </div>
    <div class="table-wrap">
      <table id="productBufferTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="col_prod">Product</th>
            <th data-i18n="col_cat_comb">Combined</th>
            <th data-i18n="col_weight_abc">Weight [ABC]</th>
            <th data-i18n="col_sales_abc">Sales [ABC]</th>
            <th data-i18n="col_price_abc">Price [ABC]</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card" id="locationSection">
    <h2 data-i18n="loc_search_title">Search &amp; add locations</h2>
    <div class="card-body">
      <div class="panel-dashed">
        <div class="flex-row" style="align-items:flex-end">
          <div class="form-group flex-1">
            <label for="manualLocName" data-i18n="lbl_loc_name">Location name</label>
            <input type="text" id="manualLocName" data-i18n-placeholder="ph_loc_name">
          </div>
          <div class="form-group flex-1">
            <label for="manualLocGroup" data-i18n="lbl_loc_group">Location group</label>
            <select id="manualLocGroup"></select>
          </div>
          <div class="form-group">
            <button type="button" class="btn btn-secondary" onclick="addManualLocation()" data-i18n="btn_add_loc">Add location</button>
          </div>
        </div>
      </div>

      <div class="flex-row">
        <div class="form-group flex-1">
          <label for="filterGroup" data-i18n="lbl_filter_group">Location group</label>
          <select id="filterGroup" onchange="filterLocations()">
            <option value="" data-i18n="opt_all_groups">All groups</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label for="filterLetter" data-i18n="lbl_filter_letter">1st letter</label>
          <select id="filterLetter" onchange="filterLocations()">
            <option value="" data-i18n="opt_all_letters">All letters</option>
          </select>
        </div>
        <div class="form-group flex-1">
          <label for="filterLevel" data-i18n="lbl_filter_level">Level</label>
          <select id="filterLevel" onchange="filterLocations()">
            <option value="" data-i18n="opt_all_levels">All levels</option>
          </select>
        </div>
      </div>
      <h3 class="sub"><span data-i18n="loc_results">Locations found</span> (<span id="locationCount">0</span>)</h3>
    </div>
    <div class="table-wrap">
      <table id="locationResultsTable">
        <thead>
          <tr>
            <th data-i18n="col_loc_name">Location</th>
            <th data-i18n="col_group">Group</th>
            <th data-i18n="col_1st_letter">1st letter</th>
            <th data-i18n="col_3rd_num">Level</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<nav class="nav-bar" data-nav></nav>

<script>
  let products = [];
  let locations = [];
  const $ = (id) => document.getElementById(id);
  const GROUPS = ['AA','AB','AC','BA','BB','BC','CA','CB','CC'];

  // Fill the select boxes
  function addOptions(select, values) {
    values.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; select.appendChild(o); });
  }
  addOptions($('manualLocGroup'), GROUPS);
  addOptions($('filterGroup'), GROUPS);
  addOptions($('filterLetter'), Array.from({ length: 26 }, (_, i) => String.fromCharCode(65 + i)));
  addOptions($('filterLevel'), Array.from({ length: 10 }, (_, i) => String(i)));

  $('excelFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    WSK.readWorkbook(file, (wb) => {
      const data = { rows: WSK.sheetRows(wb, 0), rows2: wb.SheetNames.length > 1 ? WSK.sheetRows(wb, 1) : [] };
      loadRows(data);
      source.saved(file.name, data);
    }, $('excelStatus'));
  });

  /* rows: A name, B weight, C sales, D price, E/F location + group; rows2: location + group */
  function loadRows(data) {
      products = [];
      locations = [];
      const rows1 = data.rows || [];
      for (let i = 1; i < rows1.length; i++) {
        const r = rows1[i];
        if (!r || !r.length) continue;
        const name = String(r[0] ?? '').trim();
        if (name && r.length >= 2) {
          products.push(newProduct(name, parseFloat(r[1]) || 0, parseFloat(r[2]) || 0, parseFloat(r[3]) || 0));
        }
        const locName = String(r[4] ?? '').trim();
        const groupName = String(r[5] ?? '').trim();
        if (locName && groupName) locations.push({ name: locName, group: groupName });
      }
      {
        const rows2 = data.rows2 || [];
        for (let i = 1; i < rows2.length; i++) {
          const r = rows2[i];
          if (!r || !r.length) continue;
          const locName = String(r[0] ?? '').trim();
          if (locName) locations.push({ name: locName, group: String(r[1] ?? '').trim() });
        }
      }
      WSK.setText($('excelStatus'), 'excel_loaded', { n: products.length + locations.length });
      renderProductsTable();
      filterLocations();
  }

  // master workbook: MasterData → product code, weight, sales, price
  const source = WSKSession.wireModule({
    page: 'abc', srcEl: $('srcLine'), load: loadRows,
    clear: () => { products = []; locations = []; renderProductsTable(); filterLocations(); },
    fromMain: () => {
      const m = WSKSession.sheet('masterdata').filter(r => r[0]);
      return m.length ? { rows: [['product', 'weight', 'sales', 'price'], ...m.map(r => [r[0], r[6], r[7], r[8]])], rows2: [] } : null;
    }
  });

  function newProduct(name, weight, sales, price) {
    return { name, weight, sales, price, abcWeight: '', abcSales: '', abcPrice: '', combinedCat: '' };
  }

  function addManualProduct() {
    const name = $('prodName').value.trim();
    if (!name) { alert(WSK.t('msg_enter_name')); return; }
    products.push(newProduct(name,
      parseFloat($('prodWeight').value) || 0,
      parseFloat($('prodSales').value) || 0,
      parseFloat($('prodPrice').value) || 0));
    ['prodName', 'prodWeight', 'prodSales', 'prodPrice'].forEach(id => $(id).value = '');
    $('prodName').focus();
    renderProductsTable();
  }

  function addManualLocation() {
    const name = $('manualLocName').value.trim();
    if (!name) { alert(WSK.t('msg_enter_loc')); return; }
    locations.push({ name, group: $('manualLocGroup').value });
    $('manualLocName').value = '';
    filterLocations();
  }

  function badge(cat) {
    return cat ? `<span class="badge badge-${cat.toLowerCase()}">${cat}</span>` : '';
  }

  function fmt(n, digits) {
    return Number(n).toLocaleString(WSK.getLang() === 'en' ? 'en-GB' : WSK.getLang(), { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }

  function renderProductsTable() {
    const sortBy = $('sortProductsBy').value;
    const key = { combined: 'combinedCat', weight: 'abcWeight', sales: 'abcSales', price: 'abcPrice' }[sortBy];
    products.sort((a, b) => sortBy === 'name'
      ? a.name.localeCompare(b.name, undefined, { numeric: true })
      : (a[key] || 'ZZ').localeCompare(b[key] || 'ZZ'));

    $('productCount').textContent = products.length;
    const tbody = document.querySelector('#productBufferTable tbody');
    if (!products.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-cell">${WSK.esc(WSK.t('no_rows'))}</td></tr>`;
      return;
    }
    tbody.innerHTML = products.map((p, i) => `
      <tr>
        <td class="num">${i + 1}</td>
        <td><strong>${WSK.esc(p.name)}</strong></td>
        <td>${p.combinedCat ? `<span class="badge badge-info">${p.combinedCat}</span>` : `<span class="muted">${WSK.esc(WSK.t('not_classified'))}</span>`}</td>
        <td class="num">${fmt(p.weight, 2)} kg${badge(p.abcWeight)}</td>
        <td class="num">${fmt(p.sales, 0)} ${WSK.esc(WSK.t('unit_pcs'))}${badge(p.abcSales)}</td>
        <td class="num">${fmt(p.price, 2)} €${badge(p.abcPrice)}</td>
      </tr>`).join('');
  }

  function calculateABC() {
    const N = products.length;
    if (!N) { alert(WSK.t('msg_empty_prods')); return; }

    let countA = Math.round(N * 0.33);
    let countC = Math.round(N * 0.33);
    if (N <= 2) { countA = 1; countC = 0; }
    const countB = Math.max(0, N - countA - countC);

    function assign(prop, resultKey) {
      [...products].sort((a, b) => b[prop] - a[prop]).forEach((p, idx) => {
        p[resultKey] = idx < countA ? 'A' : idx < countA + countB ? 'B' : 'C';
      });
    }
    assign('weight', 'abcWeight');
    assign('sales', 'abcSales');
    assign('price', 'abcPrice');
    products.forEach(p => { p.combinedCat = p.abcWeight + p.abcSales; });

    renderProductsTable();
    filterLocations();
  }

  function filterLocations() {
    const grp = $('filterGroup').value;
    const letter = $('filterLetter').value;
    const level = $('filterLevel').value;
    const tbody = document.querySelector('#locationResultsTable tbody');

    const found = locations.filter(loc => {
      const n = loc.name.toUpperCase();
      return (!grp || loc.group.toUpperCase() === grp) &&
             (!letter || n.charAt(0) === letter) &&
             (!level || (n.length >= 4 && n.charAt(3) === level));
    });

    $('locationCount').textContent = found.length;
    if (!found.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="empty-cell">${WSK.esc(WSK.t(locations.length ? 'no_locations' : 'no_rows'))}</td></tr>`;
      return;
    }
    tbody.innerHTML = found.map(loc => {
      const n = loc.name.toUpperCase();
      return `<tr>
        <td><span class="loc-tag">${WSK.esc(loc.name)}</span></td>
        <td>${loc.group ? `<span class="badge badge-info">${WSK.esc(loc.group)}</span>` : ''}</td>
        <td>${WSK.esc(n.charAt(0))}</td>
        <td>${WSK.esc(n.length >= 4 ? n.charAt(3) : '')}</td>
      </tr>`;
    }).join('');
  }

  document.addEventListener('wsk:langchange', () => { renderProductsTable(); filterLocations(); });
  renderProductsTable();
  filterLocations();
</script>
</body>
